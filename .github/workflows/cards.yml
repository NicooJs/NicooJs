name: Profile Cards (Stable)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      # CARD 1 — STATS (geral)
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicooJs
          template: classic
          config_timezone: America/Sao_Paulo
          base: header, activity, repositories
          filename: stats.svg

      # CARD 2 — LANGUAGES
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicooJs
          template: classic
          config_timezone: America/Sao_Paulo
          base: header
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          filename: langs.svg

      # CARD 3 — “STREAK” (equivalente estável)
      # (metrics não tem o mesmo streak do outro card, então usamos calendário + ritmo)
      - name: Generate activity card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicooJs
          template: classic
          config_timezone: America/Sao_Paulo
          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          filename: streak.svg
