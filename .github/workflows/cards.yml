name: Profile Cards

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download stats card
        run: |
          curl -L "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api?username=NicooJs&show_icons=true&hide_border=true&theme=tokyonight" -o stats.svg

      - name: Download languages card
        run: |
          curl -L "https://github-readme-stats-git-masterrstaa-rickstaa.vercel.app/api/top-langs/?username=NicooJs&layout=compact&hide_border=true&theme=tokyonight" -o langs.svg

      - name: Download streak card
        run: |
          curl -L "https://streak-stats.demolab.com?user=NicooJs&hide_border=true&theme=tokyonight" -o streak.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg streak.svg
          git commit -m "chore: update profile cards" || exit 0
          git push
