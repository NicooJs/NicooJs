name: Dashboard Cards

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CARD 1 — STATS (principal)
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicooJs
          template: classic
          theme: tokyonight
          config_timezone: America/Sao_Paulo
          base: header, activity, repositories
          filename: stats.svg

      # CARD 2 — LANGUAGES (sem header/duplicacao)
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NicooJs
          template: classic
          theme: tokyonight
          config_timezone: America/Sao_Paulo

          # tenta remover duplicacao do topo
          base: ""

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          filename: langs.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git commit -m "chore: update dashboard cards (tokyonight)" || exit 0
          git push
